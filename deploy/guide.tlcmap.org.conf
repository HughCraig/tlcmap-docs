# Apache virtual host for the interim documentation host, guide.tlcmap.org.
#
# This is where the site goes live first. docs.tlcmap.org keeps serving the
# WordPress site until the cutover described in the README; at that point the
# documentation moves to deploy/docs.tlcmap.org.conf and this host becomes a
# redirect to it.
#
#   sudo a2enmod rewrite headers deflate
#   sudo cp deploy/guide.tlcmap.org.conf /etc/apache2/sites-available/
#   sudo cp deploy/robots-noindex.txt /var/www/guide.tlcmap.org-robots.txt
#   sudo a2ensite guide.tlcmap.org
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The document root holds the built site only — the contents of
# docs/.vitepress/dist. It must not sit under the TLCMap application's document
# root, or Laravel's front controller rewrite in public/.htaccess will take over
# these URLs.
#
# There are deliberately no legacy /help/ or WordPress redirects here. Those
# belong to docs.tlcmap.org, which still serves WordPress; no old link points at
# guide.tlcmap.org.

<VirtualHost *:80>
    ServerName guide.tlcmap.org
    Redirect permanent / https://guide.tlcmap.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName guide.tlcmap.org
    DocumentRoot /var/www/guide.tlcmap.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/guide.tlcmap.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/guide.tlcmap.org/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/guide.tlcmap.org-error.log
    CustomLog ${APACHE_LOG_DIR}/guide.tlcmap.org-access.log combined

    <Directory /var/www/guide.tlcmap.org>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        DirectoryIndex index.html

        # The site is built with cleanUrls, so pages are linked as
        # /guide/accounts but written to disk as guide/accounts.html. Without
        # this rule every internal link on the site returns 404.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME}.html -f
        RewriteRule ^(.*)$ $1.html [L]
    </Directory>

    # VitePress builds its own 404 page, themed like the rest of the site.
    ErrorDocument 404 /404.html

    # --- Keep this host out of search ------------------------------------
    # The documentation is meant to be found at docs.tlcmap.org after the
    # cutover. Anything indexed here would have to be migrated, so nothing is.
    #
    # robots.txt stops well-behaved crawlers fetching at all. The header is the
    # belt to that brace: a crawler that ignores robots.txt, or that reaches a
    # URL from a link somewhere else, still sees an explicit noindex.
    Alias /robots.txt /var/www/guide.tlcmap.org-robots.txt
    <Files "guide.tlcmap.org-robots.txt">
        Require all granted
    </Files>
    Header always set X-Robots-Tag "noindex, nofollow"

    # The sitemap names docs.tlcmap.org, which is not this host and is not ours
    # to advertise yet. Nothing should be reading it here.
    <Files "sitemap.xml">
        Require all denied
    </Files>

    # HTML is rewritten on every deployment, so it must always be revalidated.
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache"
    </FilesMatch>

    # Screenshots, logos and the favicon are not content-hashed, so they keep a
    # short lifetime — a replaced screenshot appears within the day.
    <FilesMatch "\.(png|jpe?g|gif|svg|ico|webp)$">
        Header always set Cache-Control "public, max-age=86400"
    </FilesMatch>

    # Everything under /assets/ carries a content hash in its filename and is
    # replaced rather than edited, so it can be cached indefinitely. This block
    # is last because Location is merged after Files and must win.
    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml \
        application/javascript application/json image/svg+xml
</VirtualHost>
