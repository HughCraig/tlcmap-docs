# Apache virtual host for the TLCMap documentation site at its final hostname.
#
# This is the cutover configuration, not the one in use today: the site is
# deployed first at guide.tlcmap.org (deploy/guide.tlcmap.org.conf), and
# docs.tlcmap.org keeps serving WordPress until the cutover described in the
# README. Enable this host on the same day the WordPress site moves to
# site.tlcmap.org, and not before — the redirects below assume both.
#
# Tested against Apache 2.4 with the rules below; the TLS lines are the ones
# certbot writes and are shown for completeness.
#
#   sudo a2enmod rewrite headers deflate
#   sudo cp deploy/docs.tlcmap.org.conf /etc/apache2/sites-available/
#   sudo a2ensite docs.tlcmap.org
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The repository is cloned to /var/www/tlcmap-docs and built there. Only the
# build output is served: the document root is the dist directory inside it, so
# the working tree, .git and node_modules are all outside the web path.
#
# It must also stay clear of the TLCMap application's document root, or
# Laravel's front controller rewrite in public/.htaccess will take over these
# URLs.

<VirtualHost *:80>
    ServerName docs.tlcmap.org
    Redirect permanent / https://docs.tlcmap.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName docs.tlcmap.org
    DocumentRoot /var/www/tlcmap-docs/docs/.vitepress/dist

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/docs.tlcmap.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/docs.tlcmap.org/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/docs.tlcmap.org-error.log
    CustomLog ${APACHE_LOG_DIR}/docs.tlcmap.org-access.log combined

    <Directory /var/www/tlcmap-docs/docs/.vitepress/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        DirectoryIndex index.html

        # The site is built with cleanUrls, so pages are linked as
        # /guide/accounts but written to disk as guide/accounts.html. Without
        # this rule every internal link on the site returns 404.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME}.html -f
        RewriteRule ^(.*)$ $1.html [L]
    </Directory>

    # VitePress builds its own 404 page, themed like the rest of the site.
    ErrorDocument 404 /404.html

    # HTML is rewritten on every deployment, so it must always be revalidated.
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache"
    </FilesMatch>

    # Screenshots, logos and the favicon are not content-hashed, so they keep a
    # short lifetime — a replaced screenshot appears within the day.
    <FilesMatch "\.(png|jpe?g|gif|svg|ico|webp)$">
        Header always set Cache-Control "public, max-age=86400"
    </FilesMatch>

    # Everything under /assets/ carries a content hash in its filename and is
    # replaced rather than edited, so it can be cached indefinitely. This block
    # is last because Location is merged after Files and must win.
    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml \
        application/javascript application/json image/svg+xml

    # --- Legacy paths -----------------------------------------------------
    # This host used to serve the WordPress site, and those URLs appear in
    # publications and third-party links. Both sets are permanent.

    # The /help/ documentation, now this site. Specific rules first: mod_alias
    # applies the first match.
    RedirectMatch 301 "^/help/faqs/?$"          "/guide/faqs"
    RedirectMatch 301 "^/help/developers/?$"    "/developers/"
    RedirectMatch 301 "^/help/guides/guide/?$"  "/guide/"
    RedirectMatch 301 "^/help/guides/?$"        "/guide/"
    RedirectMatch 301 "^/help/?$"               "/"
    RedirectMatch 301 "^/help/.*$"              "/"

    # The general and institutional pages, now on site.tlcmap.org. These are
    # named explicitly rather than caught by a fallback, so that an unknown path
    # still reaches this site's own 404 page instead of being bounced to a
    # WordPress 404. Add any further top-level WordPress paths here.
    RedirectMatch 301 "^/(about|contact|first-australians|core-data|partners|researchers|research-outputs|updates|newsletter)(/.*)?$" "https://site.tlcmap.org$0"
</VirtualHost>

# The interim host, once the documentation has moved here. Every path maps
# across unchanged, so a link made during the guide.tlcmap.org period keeps
# working.
<VirtualHost *:443>
    ServerName guide.tlcmap.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/guide.tlcmap.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/guide.tlcmap.org/privkey.pem

    RedirectMatch 301 "^/(.*)$" "https://docs.tlcmap.org/$1"
</VirtualHost>

<VirtualHost *:80>
    ServerName guide.tlcmap.org
    RedirectMatch 301 "^/(.*)$" "https://docs.tlcmap.org/$1"
</VirtualHost>
